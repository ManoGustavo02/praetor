<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Praetor Loading</title>
<!--
	Praetor loading screen. Garry's Mod opens this page while a player joins
	(sv_loadingurl). Praetor builds the link from its settings, for example:
	index.html?name=My%20Server&sub=Have%20fun&accent=8e62ff&tips=Tip%20one|Tip%20two&music=1&vol=40
	Parameters: name, fixed, sub, accent (hex), tips (split by |), music (1 = default, 0 = off, or a link
	to an .mp3/.ogg), vol (0-100), bg (link to a picture or GIF; empty = the starry sky in bg.gif, none = plain colours), logo (link to a picture), discord (text),
	map (%m), which Garry's Mod fills in.
	Layout: the server at the top left, tips and music on the right, and at the bottom the
	download panel: the step you are in, the file being downloaded now, how many are left,
	the time it is taking, an estimate of the time left and the last files that arrived.
	Written for old and new GMod browsers: no flexbox, no modern JS.
-->
<style>
@font-face { font-family: "Praetor Display"; src: url("fonts/praetor_display.ttf") format("truetype"); }
@font-face { font-family: "Praetor Body"; src: url("fonts/praetor_body_heavy.ttf") format("truetype"); font-weight: 800; }
@font-face { font-family: "Praetor Body"; src: url("fonts/praetor_body_black.ttf") format("truetype"); font-weight: 900; }

* { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0914; color: #f4f1ff;
	font-family: "Praetor Body", "Nunito", "Segoe UI", sans-serif; font-weight: 800; -webkit-user-select: none; user-select: none; }
.disp { font-family: "Praetor Display", "Praetor Body", sans-serif; font-weight: normal; letter-spacing: .02em; }
.dim { color: #9a93b8; }

/* ------------------------------------------------------------ background */
#bg { position: absolute; left: -2%; top: -2%; width: 104%; height: 104%; background-color: #120e22; background-size: cover; background-position: center;
	-webkit-animation: zoom 40s ease-in-out infinite alternate; animation: zoom 40s ease-in-out infinite alternate; }
.blob { position: absolute; width: 70vh; height: 70vh; border-radius: 50%; opacity: .55;
	-webkit-animation: float 18s ease-in-out infinite alternate; animation: float 18s ease-in-out infinite alternate; }
#b1 { left: -12vh; top: -18vh; }
#b2 { right: -16vh; top: 22vh; -webkit-animation-duration: 23s; animation-duration: 23s; opacity: .35; }
#b3 { left: 35%; bottom: -40vh; -webkit-animation-duration: 27s; animation-duration: 27s; opacity: .3; }
#dots { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: .5;
	background-image: -webkit-radial-gradient(rgba(255,255,255,.10) 1.2px, transparent 1.5px); background-image: radial-gradient(rgba(255,255,255,.10) 1.2px, transparent 1.5px);
	background-size: 18px 18px; }
#shade { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
	background: -webkit-linear-gradient(top, rgba(8,6,16,.55) 0%, rgba(8,6,16,.15) 35%, rgba(8,6,16,.55) 62%, rgba(8,6,16,.92) 100%);
	background: linear-gradient(to bottom, rgba(8,6,16,.55) 0%, rgba(8,6,16,.15) 35%, rgba(8,6,16,.55) 62%, rgba(8,6,16,.92) 100%); }
#shade.img { background: -webkit-linear-gradient(top, rgba(8,6,16,.35) 0%, rgba(8,6,16,0) 30%, rgba(8,6,16,.2) 58%, rgba(8,6,16,.82) 100%);
	background: linear-gradient(to bottom, rgba(8,6,16,.35) 0%, rgba(8,6,16,0) 30%, rgba(8,6,16,.2) 58%, rgba(8,6,16,.82) 100%); }
#vign { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
	background: -webkit-radial-gradient(center, ellipse, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%);
	background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%); }

/* ------------------------------------------------------------ cards */
.card { position: absolute; background: rgba(17,13,32,.82); border: 3px solid rgba(236,232,250,.9); border-radius: 18px;
	box-shadow: 7px 8px 0 rgba(5,4,10,.85); opacity: 0;
	-webkit-animation: rise .7s cubic-bezier(.2,1.25,.4,1) forwards; animation: rise .7s cubic-bezier(.2,1.25,.4,1) forwards; }
.cap { font-size: 1.5vh; letter-spacing: .14em; text-transform: uppercase; color: #9a93b8; font-weight: 900; }

/* ------------------------------------------------------------ server (top left) */
#head { position: absolute; left: 4vw; top: 5.5vh; width: 58vw; opacity: 0;
	-webkit-animation: rise .7s .05s cubic-bezier(.2,1.25,.4,1) forwards; animation: rise .7s .05s cubic-bezier(.2,1.25,.4,1) forwards; }
#logo { position: absolute; left: 0; top: 0; width: 11vh; height: 11vh; border-radius: 22px; border: 3px solid #f4f1ff; overflow: hidden;
	box-shadow: 6px 7px 0 #05040a; text-align: center; line-height: 10.4vh; font-size: 6.4vh; color: #fff; }
#logo img { width: 100%; height: 100%; display: block; }
#nameBox { position: absolute; left: 13.6vh; top: -.6vh; right: 0; }
#title { font-family: "Praetor Display", sans-serif; font-size: 7.6vh; line-height: 1.08; color: #fff; white-space: nowrap; display: inline-block;
	text-shadow: 0 .55vh 0 #05040a; }
#sub { display: inline-block; margin-top: .6vh; padding: .5vh 1.4vh; border-radius: 99px; font-size: 1.9vh; font-weight: 900; color: #fff;
	border: 2px solid #05040a; box-shadow: 3px 3px 0 #05040a; }
#chips { position: absolute; left: 0; top: 14.6vh; white-space: nowrap; }
.chip { display: inline-block; vertical-align: top; margin-right: 1vh; padding: .8vh 1.6vh .8vh 1vh; border-radius: 99px;
	background: rgba(17,13,32,.8); border: 2px solid rgba(236,232,250,.25); }
.chip .ic { display: inline-block; vertical-align: middle; width: 3.2vh; height: 3.2vh; border-radius: 50%; margin-right: 1vh; text-align: center; padding-top: .55vh; }
.chip .ic svg { width: 2vh; height: 2vh; }
.chip .tx { display: inline-block; vertical-align: middle; }
.chip .k { display: block; font-size: 1.25vh; letter-spacing: .12em; text-transform: uppercase; color: #9a93b8; font-weight: 900; line-height: 1.2; }
.chip .v { display: block; font-size: 2vh; color: #fff; font-weight: 900; line-height: 1.2; max-width: 26vw; overflow: hidden; text-overflow: ellipsis; }

/* ------------------------------------------------------------ music (top right) */
#music { position: absolute; right: 4vw; top: 5.5vh; padding: 1vh 1.8vh 1vh 1.3vh; border-radius: 99px; cursor: pointer; white-space: nowrap;
	background: rgba(17,13,32,.82); border: 2px solid rgba(236,232,250,.6); box-shadow: 4px 5px 0 rgba(5,4,10,.85); opacity: 0;
	-webkit-animation: rise .7s .15s cubic-bezier(.2,1.25,.4,1) forwards; animation: rise .7s .15s cubic-bezier(.2,1.25,.4,1) forwards; }
#eq { display: inline-block; vertical-align: middle; width: 3.2vh; height: 2.6vh; margin-right: 1.1vh; position: relative; }
#eq i { position: absolute; bottom: 0; width: .55vh; height: 30%; border-radius: 2px; background: #fff;
	-webkit-animation: eq .9s ease-in-out infinite alternate; animation: eq .9s ease-in-out infinite alternate; }
#eq i:nth-child(1) { left: 0; } #eq i:nth-child(2) { left: .9vh; -webkit-animation-delay: -.3s; animation-delay: -.3s; }
#eq i:nth-child(3) { left: 1.8vh; -webkit-animation-delay: -.6s; animation-delay: -.6s; } #eq i:nth-child(4) { left: 2.7vh; -webkit-animation-delay: -.15s; animation-delay: -.15s; }
#music.off #eq i { -webkit-animation: none; animation: none; height: 18%; opacity: .5; }
#musicTx { display: inline-block; vertical-align: middle; font-size: 1.8vh; font-weight: 900; }
#musicTx kbd { display: inline-block; margin-left: .8vh; padding: .1vh .8vh; border-radius: 6px; border: 2px solid rgba(236,232,250,.4); font-family: inherit; font-size: 1.5vh; color: #c9c2e6; }

/* ------------------------------------------------------------ tips (right) */
#tips { right: 4vw; top: 15vh; width: 31vw; min-height: 21vh; padding: 2.2vh 2.4vh 2.4vh; -webkit-animation-delay: .25s; animation-delay: .25s; }
#tipHead { white-space: nowrap; }
#tipHead .badge { display: inline-block; padding: .4vh 1.2vh; border-radius: 99px; font-size: 1.5vh; font-weight: 900; color: #fff; letter-spacing: .1em; text-transform: uppercase; border: 2px solid #05040a; }
#tipNum { float: right; font-size: 1.6vh; color: #9a93b8; padding-top: .5vh; }
#tipText { margin-top: 1.6vh; font-size: 2.35vh; line-height: 1.38; color: #fff; min-height: 9vh; -webkit-transition: opacity .35s; transition: opacity .35s; }
#tipFoot { margin-top: 1.4vh; height: 3.2vh; position: relative; }
#tipTrack { position: absolute; left: 0; top: 1.3vh; right: 13vh; height: .6vh; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
#tipRun { height: 100%; width: 0; border-radius: 4px; }
#tipBtn { position: absolute; right: 0; top: 0; padding: .45vh 1.4vh; border-radius: 99px; font-size: 1.6vh; font-weight: 900; color: #120e20; background: #ffd36b;
	border: 2px solid #05040a; box-shadow: 2px 3px 0 #05040a; cursor: pointer; }
#disc { right: 4vw; top: 40vh; width: 31vw; padding: 1.5vh 2vh; display: none; -webkit-animation-delay: .35s; animation-delay: .35s; white-space: nowrap; overflow: hidden; }
#disc .ic { display: inline-block; vertical-align: middle; width: 4.6vh; height: 4.6vh; border-radius: 14px; background: #5865f2; border: 2px solid #05040a; text-align: center; padding-top: .9vh; margin-right: 1.4vh; }
#disc .ic svg { width: 2.8vh; height: 2.8vh; }
#disc .tx { display: inline-block; vertical-align: middle; }
#vDisc { display: block; font-size: 2.1vh; color: #fff; font-weight: 900; }

/* ------------------------------------------------------------ download panel (bottom) */
#dl { left: 4vw; right: 4vw; bottom: 5vh; height: 35vh; padding: 2.6vh 3vh; -webkit-animation-delay: .4s; animation-delay: .4s; }
#dlL { position: absolute; left: 3vh; top: 2.6vh; right: 36%; bottom: 2.6vh; }
#dlR { position: absolute; right: 3vh; top: 2.6vh; width: calc(36% - 6vh); width: -webkit-calc(36% - 6vh); bottom: 2.6vh; }
#stage { font-family: "Praetor Display", sans-serif; font-size: 3.5vh; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 15vh; line-height: 1.2; }
#raw { font-size: 1.55vh; color: #7d7698; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 15vh; margin-top: .3vh; height: 2vh; }
#pct { position: absolute; right: 0; top: -.4vh; font-family: "Praetor Display", sans-serif; font-size: 6.4vh; color: #fff; line-height: 1; text-shadow: 0 .45vh 0 #05040a; }
#pct small { font-size: .45em; margin-left: .3vh; }

#steps { position: relative; margin-top: 2.2vh; height: 5.4vh; }
#stepLine { position: absolute; left: 1.5vh; right: 1.5vh; top: 1.25vh; height: .5vh; background: rgba(255,255,255,.1); border-radius: 3px; }
#stepFill { height: 100%; width: 0; border-radius: 3px; -webkit-transition: width .6s; transition: width .6s; }
.step { position: absolute; top: 0; width: 16vh; margin-left: -8vh; text-align: center; }
.step .d { display: block; width: 3vh; height: 3vh; margin: 0 auto; border-radius: 50%; background: #1d1836; border: 2px solid rgba(236,232,250,.3);
	text-align: center; font-size: 1.6vh; line-height: 2.6vh; line-height: calc(3vh - 4px); color: #9a93b8; -webkit-transition: all .3s; transition: all .3s; }
.step .n { display: block; margin-top: .5vh; font-size: 1.45vh; color: #7d7698; white-space: nowrap; }
.step.done .d { color: #fff; border-color: #05040a; }
.step.done .n { color: #c9c2e6; }
.step.on .d { color: #fff; border-color: #fff; -webkit-animation: pulse 1.3s ease-in-out infinite; animation: pulse 1.3s ease-in-out infinite; }
.step.on .n { color: #fff; }

#bar { position: relative; margin-top: 2vh; height: 3vh; border-radius: 99px; background: rgba(255,255,255,.08); border: 2px solid rgba(236,232,250,.35); overflow: hidden; }
#fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px; overflow: hidden; }
#fill i { position: absolute; left: 0; top: 0; width: 200%; height: 100%; opacity: .25;
	background-image: -webkit-linear-gradient(135deg, #fff 25%, transparent 25%, transparent 50%, #fff 50%, #fff 75%, transparent 75%, transparent);
	background-image: linear-gradient(-45deg, #fff 25%, transparent 25%, transparent 50%, #fff 50%, #fff 75%, transparent 75%, transparent);
	background-size: 3vh 3vh; -webkit-animation: stripes 1s linear infinite; animation: stripes 1s linear infinite; }
#fill b { position: absolute; left: 0; right: 0; top: 12%; height: 22%; margin: 0 1vh; border-radius: 99px; background: rgba(255,255,255,.35); }

#now { margin-top: 2.2vh; white-space: nowrap; height: 4.2vh; overflow: hidden; }
#nowTag { display: inline-block; vertical-align: middle; padding: .4vh 1.1vh; border-radius: 8px; font-size: 1.4vh; letter-spacing: .1em; text-transform: uppercase;
	font-weight: 900; color: #fff; border: 2px solid #05040a; margin-right: 1.2vh; }
#nowTx { display: inline-block; vertical-align: middle; max-width: 75%; max-width: calc(100% - 14vh); max-width: -webkit-calc(100% - 14vh); overflow: hidden; text-overflow: ellipsis; }
#nowName { font-size: 2.1vh; color: #fff; }
#nowDir { font-size: 1.55vh; color: #7d7698; margin-left: .8vh; }

#stats { height: 15.5vh; }
.stat { display: inline-block; vertical-align: top; width: 48.5%; height: 7vh; margin-bottom: 1.3vh; padding: 1vh 1.4vh; border-radius: 12px;
	background: rgba(255,255,255,.05); border: 2px solid rgba(236,232,250,.14); }
.stat:nth-child(odd) { margin-right: 3%; }
.stat .k { display: block; font-size: 1.3vh; letter-spacing: .12em; text-transform: uppercase; color: #9a93b8; font-weight: 900; }
.stat .v { display: block; margin-top: .3vh; font-size: 2.6vh; color: #fff; font-weight: 900; white-space: nowrap; overflow: hidden; }
#recent { margin-top: .4vh; }
#recent .cap { margin-bottom: .7vh; }
.rec { position: relative; height: 2.5vh; margin-bottom: .45vh; padding-left: 8.6vh; border-radius: 7px; background: rgba(255,255,255,.04);
	white-space: nowrap; overflow: hidden; -webkit-animation: recIn .35s ease-out; animation: recIn .35s ease-out; }
.rec i { position: absolute; left: .4vh; top: .4vh; width: 7.4vh; height: 1.7vh; border-radius: 5px; font-style: normal; text-align: center;
	font-size: 1.05vh; line-height: 1.7vh; letter-spacing: .08em; text-transform: uppercase; font-weight: 900; color: #0b0816; overflow: hidden; }
.rec span { display: block; font-size: 1.5vh; line-height: 2.5vh; color: #d8d2ee; overflow: hidden; text-overflow: ellipsis; padding-right: .8vh; }
.rec.empty { padding-left: 1vh; background: none; color: #6f6890; font-size: 1.5vh; line-height: 2.5vh; -webkit-animation: none; animation: none; }

#credit { position: absolute; right: 4vw; bottom: 1.6vh; font-size: 1.3vh; letter-spacing: .3em; color: rgba(244,241,255,.25); }

.swap { -webkit-animation: swap .45s ease-out; animation: swap .45s ease-out; }

@-webkit-keyframes rise { 0% { opacity: 0; -webkit-transform: translateY(3vh); } 100% { opacity: 1; -webkit-transform: translateY(0); } }
@keyframes rise { 0% { opacity: 0; transform: translateY(3vh); } 100% { opacity: 1; transform: translateY(0); } }
@-webkit-keyframes zoom { 0% { -webkit-transform: scale(1); } 100% { -webkit-transform: scale(1.06); } }
@keyframes zoom { 0% { transform: scale(1); } 100% { transform: scale(1.06); } }
@-webkit-keyframes float { 0% { -webkit-transform: translate(0, 0) scale(1); } 100% { -webkit-transform: translate(8vh, 6vh) scale(1.15); } }
@keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(8vh, 6vh) scale(1.15); } }
@-webkit-keyframes eq { 0% { height: 20%; } 100% { height: 100%; } }
@keyframes eq { 0% { height: 20%; } 100% { height: 100%; } }
@-webkit-keyframes stripes { 0% { -webkit-transform: translateX(-3vh); } 100% { -webkit-transform: translateX(0); } }
@keyframes stripes { 0% { transform: translateX(-3vh); } 100% { transform: translateX(0); } }
@-webkit-keyframes pulse { 0%, 100% { -webkit-transform: scale(1); } 50% { -webkit-transform: scale(1.18); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
@-webkit-keyframes recIn { 0% { opacity: 0; -webkit-transform: translateX(-1.5vh); } 100% { opacity: 1; -webkit-transform: translateX(0); } }
@keyframes recIn { 0% { opacity: 0; transform: translateX(-1.5vh); } 100% { opacity: 1; transform: translateX(0); } }
@-webkit-keyframes swap { 0% { opacity: 0; -webkit-transform: translateY(.8vh); } 100% { opacity: 1; -webkit-transform: translateY(0); } }
@keyframes swap { 0% { opacity: 0; transform: translateY(.8vh); } 100% { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="bg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div></div>
<div id="dots"></div>
<div id="shade"></div>
<div id="vign"></div>

<div id="head">
	<div id="logo" class="disp"></div>
	<div id="nameBox"><div id="title"></div><br><div id="sub"></div></div>
	<div id="chips">
		<div class="chip"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></span><span class="tx"><span class="k" id="lMap">Mapa</span><span class="v" id="vMap">...</span></span></div>
		<div class="chip"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-1.5-5-4-5.7"/></svg></span><span class="tx"><span class="k" id="lSlots">Vagas</span><span class="v" id="vSlots">...</span></span></div>
		<div class="chip"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="11.5" r="1"/><circle cx="18" cy="13.5" r="1"/></svg></span><span class="tx"><span class="k" id="lMode">Modo</span><span class="v" id="vMode">...</span></span></div>
	</div>
</div>

<div id="music"><span id="eq"><i></i><i></i><i></i><i></i></span><span id="musicTx"><span id="lMusic">Música</span><kbd>M</kbd></span></div>

<div class="card" id="tips">
	<div id="tipHead"><span class="badge" id="lTip">Dica</span><span id="tipNum"></span></div>
	<div id="tipText"></div>
	<div id="tipFoot"><div id="tipTrack"><div id="tipRun"></div></div><div id="tipBtn"><span id="lNext">Próxima</span> &#8594;</div></div>
</div>

<div class="card" id="disc"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5C6 6 4.6 6.6 3.5 7.6 2 10.5 1.6 13.5 2 17c1.5 1.1 3 1.8 4.6 2.3l1-1.8M16 5.5c2 .5 3.4 1.1 4.5 2.1 1.5 2.9 1.9 5.9 1.5 9.4-1.5 1.1-3 1.8-4.6 2.3l-1-1.8M7 16.8c3.3 1.4 6.7 1.4 10 0M8 5.5c2.7-.7 5.3-.7 8 0"/><circle cx="9" cy="12.5" r="1.3"/><circle cx="15" cy="12.5" r="1.3"/></svg></span><span class="tx"><span class="cap" id="lDisc">Discord</span><span id="vDisc"></span></span></div>

<div class="card" id="dl">
	<div id="dlL">
		<div id="stage"></div>
		<div id="raw"></div>
		<div id="pct">0<small>%</small></div>
		<div id="steps"><div id="stepLine"><div id="stepFill"></div></div></div>
		<div id="bar"><div id="fill"><i></i><b></b></div></div>
		<div id="now"><span id="nowTag">...</span><span id="nowTx"><span id="nowName"></span><span id="nowDir"></span></span></div>
	</div>
	<div id="dlR">
		<div id="stats">
			<div class="stat"><span class="k" id="lFiles">Arquivos</span><span class="v" id="vFiles">-</span></div><div class="stat"><span class="k" id="lLeft">Faltam</span><span class="v" id="vLeft">-</span></div>
			<div class="stat"><span class="k" id="lTime">Tempo</span><span class="v" id="vTime">0:00</span></div><div class="stat"><span class="k" id="lEta">Restante</span><span class="v" id="vEta">-</span></div>
		</div>
		<div id="recent"><div class="cap" id="lRecent">Últimos baixados</div><div id="recList"></div></div>
	</div>
</div>
<div id="credit">PRAETOR</div>

<audio id="audio" loop preload="auto"></audio>

<script>
(function () {
	// ---------------------------------------------------------------- settings from the link
	function param(k) {
		var m = new RegExp("[?&]" + k + "=([^&#]*)").exec(location.search);
		if (!m) return null;
		try { return decodeURIComponent(m[1].replace(/\+/g, " ")); } catch (e) { return m[1]; }
	}
	function $(id) { return document.getElementById(id); }
	function text(id, t) { var e = typeof id === "string" ? $(id) : id; if (e) { if (e.textContent !== undefined) e.textContent = t; else e.innerText = t; } }
	// a stat value that doesn't fit its box gets a smaller font instead of being cut
	function stat(id, t) {
		var e = $(id);
		if (!e || e._t === t) return;
		e._t = t; text(e, t);
		var size = vh(2.6), min = vh(1.4);
		e.style.fontSize = size + "px";
		while (e.scrollWidth > e.clientWidth + 1 && size > min) { size -= 1; e.style.fontSize = size + "px"; }
	}
	function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
	function vh(n) { return (window.innerHeight || document.documentElement.clientHeight) * n / 100; }
	function restart(el, cls) { el.className = el.className.replace(new RegExp("\\s*" + cls, "g"), ""); void el.offsetWidth; el.className += " " + cls; }
	function now() { return new Date().getTime(); }

	var acc = (param("accent") || "8e62ff").replace(/[^0-9a-fA-F]/g, "");
	if (acc.length !== 6) acc = "8e62ff";
	var ar = parseInt(acc.substr(0, 2), 16), ag = parseInt(acc.substr(2, 2), 16), ab = parseInt(acc.substr(4, 2), 16);
	acc = "#" + acc;
	// a very light accent gets dark text on top of it so it stays readable
	var onAcc = (ar * 0.299 + ag * 0.587 + ab * 0.114) > 170 ? "#120e20" : "#ffffff";
	function rgba(a) { return "rgba(" + ar + "," + ag + "," + ab + "," + a + ")"; }

	// paint the accent by hand (works in old browsers without CSS variables too)
	$("logo").style.backgroundColor = acc; $("logo").style.color = onAcc;
	$("sub").style.backgroundColor = acc; $("sub").style.color = onAcc;
	$("lTip").style.backgroundColor = acc; $("lTip").style.color = onAcc;
	$("tipRun").style.backgroundColor = acc;
	$("stepFill").style.backgroundColor = acc;
	$("fill").style.backgroundColor = acc;
	$("nowTag").style.backgroundColor = acc; $("nowTag").style.color = onAcc;
	var icos = document.querySelectorAll ? document.querySelectorAll(".chip .ic") : [];
	for (var ii = 0; ii < icos.length; ii++) icos[ii].style.backgroundColor = acc;
	var blobs = [["b1", .5], ["b2", .45], ["b3", .4]];
	for (var bi = 0; bi < blobs.length; bi++) {
		var g = "radial-gradient(circle, " + rgba(blobs[bi][1]) + " 0%, " + rgba(0) + " 70%)";
		$(blobs[bi][0]).style.backgroundImage = "-webkit-" + g; $(blobs[bi][0]).style.backgroundImage = g;
	}

	var name = param("name") || "Garry's Mod";
	var sub = param("sub") || "";
	var lang = String(navigator.language || navigator.userLanguage || "pt").toLowerCase().indexOf("pt") === 0 ? "pt" : "en";
	var gameVol = 1;

	var T = {
		pt: { map: "Mapa", slots: "Vagas", mode: "Modo", tip: "Dica", next: "Próxima", music: "Música", musicOff: "Música desligada",
			players: "jogadores", files: "Arquivos", left: "Faltam", time: "Tempo", eta: "Restante", recent: "Últimos baixados", none: "Nada baixado ainda",
			start: "Conectando ao servidor", ready: "Tudo pronto, entrando!", nothing: "Você já tem todos os arquivos", calc: "calculando...",
			now: "Agora", waiting: "Aguardando o servidor", of: "de",
			steps: ["Conectar", "Workshop", "Arquivos", "Scripts", "Entrar"],
			types: { model: "Modelo", texture: "Textura", sound: "Som", map: "Mapa", font: "Fonte", script: "Script", addon: "Addon", file: "Arquivo" },
			stages: { retrieving: "Buscando as informações do servidor", "sending client": "Enviando seus dados", workshop: "Baixando o conteúdo da Workshop",
				lua: "Carregando os scripts", "client info": "Recebendo as informações", parsing: "Lendo o jogo", starting: "Começando a partida", precach: "Preparando modelos e sons",
				mount: "Montando o conteúdo", download: "Baixando arquivos do servidor" },
			tips: ["Digite !menu para abrir o menu do servidor.", "Leia as regras antes de jogar.", "Viu alguém quebrando as regras? Use !report.", "Respeite os outros jogadores e as construções deles."] },
		en: { map: "Map", slots: "Slots", mode: "Mode", tip: "Tip", next: "Next", music: "Music", musicOff: "Music off",
			players: "players", files: "Files", left: "Left", time: "Time", eta: "Time left", recent: "Last downloaded", none: "Nothing downloaded yet",
			start: "Connecting to the server", ready: "All set, joining!", nothing: "You already have every file", calc: "working it out...",
			now: "Now", waiting: "Waiting for the server", of: "of",
			steps: ["Connect", "Workshop", "Files", "Scripts", "Join"],
			types: { model: "Model", texture: "Texture", sound: "Sound", map: "Map", font: "Font", script: "Script", addon: "Addon", file: "File" },
			stages: { retrieving: "Getting the server info", "sending client": "Sending your info", workshop: "Downloading Workshop content",
				lua: "Loading scripts", "client info": "Receiving info", parsing: "Reading the game", starting: "Starting the match", precach: "Getting models and sounds ready",
				mount: "Mounting content", download: "Downloading server files" },
			tips: ["Type !menu to open the server menu.", "Read the rules before you play.", "Saw someone breaking the rules? Use !report.", "Respect other players and their builds."] }
	};
	function L(k) { return (T[lang] || T.en)[k]; }

	// ---------------------------------------------------------------- server: name, sub, logo, background, discord
	function fitTitle() {
		var box = $("title"), avail = $("nameBox").offsetWidth - 10, size = vh(7.6), guard = 0;
		box.style.fontSize = size + "px";
		while (box.offsetWidth > avail && size > 14 && guard < 60) { size *= 0.94; box.style.fontSize = size + "px"; guard++; }
	}
	function setName(t) { text("title", t); fitTitle(); setLogoLetter(); }
	// an imgur page link (imgur.com/abc12) becomes the picture itself (i.imgur.com/abc12.png)
	function img(u, ext) {
		if (!u) return u;
		var m = /^(?:https?:\/\/)?(?:www\.|m\.)?imgur\.com\/([A-Za-z0-9]{5,10})\/?$/.exec(u);
		return m ? "https://i.imgur.com/" + m[1] + ext : u;
	}
	var logo = img(param("logo"), ".png");
	function setLogoLetter() { if (!logo) text("logo", name.replace(/^[^A-Za-z0-9À-ɏ]+/, "").charAt(0).toUpperCase() || "P"); }
	if (logo) $("logo").innerHTML = '<img src="' + esc(logo).replace(/"/g, "") + '">';
	setName(name);
	if (sub) text("sub", sub); else $("sub").style.display = "none";

	// without a bg of its own the page uses bg.gif (a starry night sky); bg=none keeps the coloured blobs
	var bg = param("bg");
	if (bg === "none") bg = "";
	else if (!bg) bg = "bg.gif";
	else bg = img(bg, ".gif");
	if (bg) {
		// a picture or GIF of the server: the coloured blobs make way for it
		$("bg").style.backgroundImage = 'url("' + bg.replace(/["()\\]/g, "") + '")';
		for (var bj = 0; bj < blobs.length; bj++) $(blobs[bj][0]).style.display = "none";
		$("dots").style.display = "none";
		$("shade").className = "img";
	}

	var discord = param("discord");
	if (discord) { text("vDisc", discord); $("disc").style.display = "block"; }
	var map = param("map");
	if (map && map.indexOf("%") < 0) text("vMap", map);

	// ---------------------------------------------------------------- tips
	var customTips = false;
	var tips = L("tips");
	var tp = param("tips");
	if (tp) {
		var list = tp.split("|"), clean = [];
		for (var j = 0; j < list.length; j++) if (list[j].replace(/\s/g, "") !== "") clean.push(list[j]);
		if (clean.length) { tips = clean; customTips = true; }
	}
	var TIP_MS = 9000, tipIdx = 0, tipAt = now();
	function showTip(i, instant) {
		if (!tips.length) { $("tips").style.display = "none"; return; }
		tipIdx = (i + tips.length) % tips.length;
		tipAt = now();
		text("tipNum", (tipIdx + 1) + " / " + tips.length);
		var el = $("tipText");
		if (instant) { text(el, tips[tipIdx]); return; }
		el.style.opacity = 0;
		setTimeout(function () { text(el, tips[tipIdx]); el.style.opacity = 1; }, 300);
	}
	showTip(0, true);
	$("tipBtn").onclick = function () { showTip(tipIdx + 1); };

	// ---------------------------------------------------------------- music
	var audio = $("audio");
	var mus = param("music");
	var vol = parseFloat(param("vol"));
	if (isNaN(vol)) vol = 40;
	vol = Math.max(0, Math.min(100, vol)) / 100;
	var musicOn = mus !== "0";
	var src = (!mus || mus === "1") ? "music.mp3" : mus;
	if (mus === "0") $("music").style.display = "none";
	function setMusicLabel() { text("lMusic", musicOn ? L("music") : L("musicOff")); $("music").className = musicOn ? "" : "off"; }
	function applyVol() { try { audio.volume = Math.max(0, Math.min(1, vol * gameVol)); } catch (e) {} }
	function play() { try { var p = audio.play(); if (p && p["catch"]) p["catch"](function () {}); } catch (e) {} }
	if (musicOn) { audio.src = src; applyVol(); play(); setTimeout(play, 800); }
	function toggleMusic() {
		if (mus === "0") return;
		musicOn = !musicOn;
		if (musicOn) { if (!audio.src) audio.src = src; applyVol(); play(); }
		else { try { audio.pause(); } catch (e) {} }
		setMusicLabel();
	}
	$("music").onclick = toggleMusic;
	document.onkeydown = function (e) { e = e || window.event; if ((e.keyCode || e.which) === 77) toggleMusic(); };

	// ---------------------------------------------------------------- steps
	var stepEls = [];
	(function () {
		var box = $("steps");
		for (var i = 0; i < 5; i++) {
			var s = document.createElement("div");
			s.className = "step";
			// circle centres sit on the line, which runs from 1.5vh to (width - 1.5vh)
			var pos = "(1.5vh + (100% - 3vh) * " + (i / 4) + ")";
			s.style.left = "-webkit-calc" + pos; s.style.left = "calc" + pos;
			s.innerHTML = '<span class="d">' + (i + 1) + '</span><span class="n"></span>';
			box.appendChild(s);
			stepEls.push(s);
		}
		// the first and the last label sit inside the panel, under their circle
		stepEls[0].style.left = "0"; stepEls[0].style.marginLeft = "0"; stepEls[0].style.width = "auto"; stepEls[0].style.textAlign = "left";
		stepEls[0].firstChild.style.margin = "0";
		stepEls[4].style.left = "auto"; stepEls[4].style.right = "0"; stepEls[4].style.marginLeft = "0"; stepEls[4].style.width = "auto"; stepEls[4].style.textAlign = "right";
		stepEls[4].firstChild.style.margin = "0 0 0 auto";
	})();
	var step = 0;
	function setStep(n) {
		if (n < step) return;
		step = n;
		for (var i = 0; i < stepEls.length; i++) {
			var cls = "step" + (i < step ? " done" : (i === step ? " on" : ""));
			stepEls[i].className = cls;
			stepEls[i].firstChild.style.backgroundColor = i < step ? acc : (i === step ? rgba(.55) : "");
			stepEls[i].firstChild.innerHTML = i < step ? "&#10003;" : String(i + 1);
		}
		$("stepFill").style.width = (step / 4 * 100) + "%";
	}

	function applyLang() {
		text("lMap", L("map")); text("lSlots", L("slots")); text("lMode", L("mode"));
		text("lTip", L("tip")); text("lNext", L("next"));
		text("lFiles", L("files")); text("lLeft", L("left")); text("lTime", L("time")); text("lEta", L("eta")); text("lRecent", L("recent"));
		var names = L("steps");
		for (var i = 0; i < stepEls.length; i++) stepEls[i].lastChild.innerHTML = esc(names[i]);
		if (!customTips) { tips = L("tips"); showTip(tipIdx, true); }
		setMusicLabel();
		if (lastStatus) setStatus(lastStatus, true); else text("stage", L("start"));
		renderRecent(); renderNow();
	}

	// ---------------------------------------------------------------- files
	var TYPES = { mdl: "model", vvd: "model", vtx: "model", phy: "model", ani: "model", vmt: "texture", vtf: "texture", png: "texture", jpg: "texture",
		wav: "sound", mp3: "sound", ogg: "sound", bsp: "map", nav: "map", ain: "map", ttf: "font", otf: "font", lua: "script", gma: "addon" };
	var total = 0, needed = 0, cur = null, recent = [], firstFileAt = 0, doneAtFirst = 0;
	function typeOf(path) { var m = /\.([a-z0-9]+)$/i.exec(path || ""); return (m && TYPES[m[1].toLowerCase()]) || "file"; }
	function renderNow() {
		if (cur) {
			text("nowTag", L("types")[cur.type] || cur.type);
			text("nowName", cur.name); text("nowDir", cur.dir);
			$("nowTag").style.display = "";
		} else {
			$("nowTag").style.display = "none";
			text("nowName", step >= 3 ? (total === 0 && !wsSeen ? L("nothing") : "") : L("waiting"));
			text("nowDir", "");
		}
	}
	function renderRecent() {
		var html = "";
		if (!recent.length) html = '<div class="rec empty">' + esc(L("none")) + "</div>";
		for (var i = 0; i < recent.length; i++) {
			var r = recent[i];
			html += '<div class="rec"' + (i === 0 ? "" : ' style="-webkit-animation:none;animation:none;opacity:' + (1 - i * 0.17).toFixed(2) + '"') + '>'
				+ '<i style="background:' + (TYPE_COL[r.type] || acc) + '">' + esc(L("types")[r.type] || r.type) + '</i><span>' + esc(r.name) + "</span></div>";
		}
		var list = $("recList");
		list.innerHTML = html;
		// only the rows that fit in the column (small screens show fewer)
		var limit = $("dlR").getBoundingClientRect().bottom;
		while (list.childNodes.length > 1 && list.lastChild.getBoundingClientRect().bottom > limit + 0.5) list.removeChild(list.lastChild);
	}
	// newest on top: the type in its colour and the file name
	var TYPE_COL = { texture: "#5aaaff", sound: "#54dc8a", map: "#ffc44a", font: "#ff8290", script: "#c9c2e6", file: "#9a93b8" };
	function pushRecent(f) {
		recent.unshift({ name: f.name, type: f.type });
		if (recent.length > 4) recent.length = 4;
		renderRecent();
	}
	function fmt(sec) {
		sec = Math.max(0, Math.round(sec));
		var m = Math.floor(sec / 60), s = sec % 60;
		if (m >= 60) return Math.floor(m / 60) + "h " + (m % 60) + "m";
		return m + ":" + (s < 10 ? "0" : "") + s;
	}

	// ---------------------------------------------------------------- progress (Garry's Mod calls these)
	var started = now(), shown = 0, target = 0, wsSeen = false, wsDone = 0, wsTotal = 0;
	function setTarget(p) { if (p > target) target = Math.min(100, p); }
	function tick() {
		if (shown < target) shown += Math.max(0.2, (target - shown) * 0.08);
		if (shown > target) shown = target;
		// slow crawl so it never looks stuck when there is nothing to download
		if (target < 92 && total === 0) target += 0.03;
		$("fill").style.width = shown.toFixed(2) + "%";
		$("pct").innerHTML = Math.floor(shown) + "<small>%</small>";
		if (shown >= 99.5) text("stage", L("ready"));
		$("tipRun").style.width = Math.min(100, (now() - tipAt) / TIP_MS * 100) + "%";
		if (now() - tipAt > TIP_MS) showTip(tipIdx + 1);
	}
	setInterval(tick, 40);

	function second() {
		stat("vTime", fmt((now() - started) / 1000));
		// files left and an estimate from the speed so far
		var done = total - needed;
		if (wsTotal > 0 && step <= 1) {
			stat("vFiles", wsDone + " " + L("of") + " " + wsTotal);
			stat("vLeft", String(Math.max(0, wsTotal - wsDone)));
		} else if (total > 0) {
			stat("vFiles", done + " " + L("of") + " " + total);
			stat("vLeft", String(needed));
		}
		var eta = "-";
		if (total > 0 && needed > 0 && firstFileAt) {
			var got = done - doneAtFirst, secs = (now() - firstFileAt) / 1000;
			eta = (got >= 3 && secs > 1) ? "~" + fmt(needed / (got / secs)) : L("calc");
		} else if (step >= 3 || (total > 0 && needed === 0)) eta = "0:00";
		stat("vEta", eta);
	}
	setInterval(second, 1000);

	var lastStatus = "";
	// status text -> [step, progress]
	var stages = [["retrieving", 0, 6], ["sending client", 0, 10], ["workshop", 1, 14], ["mount", 1, 16], ["download", 2, 18], ["lua", 3, 90],
		["client info", 3, 92], ["parsing", 3, 93], ["starting", 4, 95], ["precach", 4, 97]];
	function setStatus(s, quiet) {
		lastStatus = s;
		var low = s.toLowerCase(), nice = "", st = L("stages"), hit = null;
		for (var i = 0; i < stages.length; i++) if (low.indexOf(stages[i][0]) >= 0) { nice = st[stages[i][0]] || ""; hit = stages[i]; }
		if (hit && !quiet) { setTarget(hit[2]); setStep(hit[1]); }
		// Workshop: "x/y" and the addon name in quotes, when Garry's Mod gives them
		var cnt = /(\d+)\s*\/\s*(\d+)/.exec(s);
		var q = /'([^']+)'|"([^"]+)"/.exec(s);
		if (!quiet && (hit && hit[1] === 1 || (!hit && (cnt || q) && step <= 1))) {
			wsSeen = true;
			if (!hit) setStep(1);
			if (cnt) { wsDone = parseInt(cnt[1], 10); wsTotal = Math.max(wsTotal, parseInt(cnt[2], 10)); setTarget(10 + (wsDone / Math.max(1, wsTotal)) * 8); }
			if (q) {
				var addon = q[1] || q[2];
				if (!cur || cur.name !== addon) {
					if (cur && cur.type === "addon") pushRecent(cur);
					cur = { name: addon, dir: "", type: "addon" };
					renderNow();
				}
			}
		}
		if (step >= 3 && cur) { pushRecent(cur); cur = null; }
		var shownText = nice || s;
		var el = $("stage");
		if ((el.textContent || el.innerText) !== shownText) { text(el, shownText); if (!quiet) restart(el, "swap"); }
		text("raw", nice ? s : "");
		renderNow();
	}

	window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
		if (language) lang = String(language).toLowerCase().indexOf("pt") === 0 ? "pt" : "en";
		if (!param("fixed") && servername && servername !== name) { name = servername; setName(name); }
		if (mapname) { text("vMap", mapname); restart($("vMap"), "swap"); }
		if (maxplayers) { text("vSlots", maxplayers + " " + L("players")); restart($("vSlots"), "swap"); }
		if (gamemode) { text("vMode", gamemode); restart($("vMode"), "swap"); }
		if (volume !== undefined && volume !== null && !isNaN(parseFloat(volume))) { gameVol = parseFloat(volume); applyVol(); }
		applyLang();
		setTarget(4);
	};
	window.SetFilesTotal = function (n) { total = Math.max(total, n || 0); second(); };
	window.SetFilesNeeded = function (n) {
		needed = n || 0;
		if (total > 0) setTarget(18 + (total - needed) / total * 70);
		second();
	};
	window.DownloadingFile = function (f) {
		var path = String(f || "").replace(/\\/g, "/");
		var nm = path.replace(/^.*\//, ""), dir = path.indexOf("/") >= 0 ? path.replace(/\/[^\/]*$/, "/") : "";
		if (!firstFileAt) { firstFileAt = now(); doneAtFirst = total - needed; }
		if (cur && cur.name !== nm) pushRecent(cur);
		cur = { name: nm, dir: dir, type: typeOf(nm) };
		setStep(2);
		if (lastStatus.toLowerCase().indexOf("download") < 0) { var el = $("stage"); text(el, L("stages").download); }
		renderNow();
		restart($("nowTx"), "swap");
	};
	window.SetStatusChanged = function (s) { setStatus(String(s || "")); };

	setStep(0);
	applyLang();
	second();

	// fonts arrive a moment later: measure again once they are in
	setTimeout(fitTitle, 400); setTimeout(function () { window.onresize(); }, 1500);
	window.onresize = function () {
		fitTitle();
		renderRecent();
		var ids = ["vFiles", "vLeft", "vTime", "vEta"];
		for (var i = 0; i < ids.length; i++) { var e = $(ids[i]); if (e && e._t !== undefined) { var t = e._t; e._t = null; stat(ids[i], t); } }
	};
})();
</script>
</body>
</html>
