<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Praetor Loading</title>
<!--
	Praetor loading screen. Garry's Mod opens this page while a player joins
	(sv_loadingurl). Praetor builds the link from its settings, for example:
	index.html?name=My%20Server&sub=Have%20fun&accent=8e62ff&tips=Tip%20one|Tip%20two&music=1&vol=40
	Parameters: name, fixed, sub, accent (hex), tips (split by |), music (1 = default, 0 = off, or a link
	to an .mp3/.ogg), vol (0-100), bg (link to a picture), logo (link to a picture), discord (text),
	map (%m) and sid (%s), which Garry's Mod fills in.
	The page is drawn like a comic book page: four panels, a narrator, a speech bubble,
	a sound effect that fills up while you load and a cassette for the music.
	Written for old and new GMod browsers: no flexbox, no modern JS.
-->
<style>
@font-face { font-family: "Praetor Display"; src: url("fonts/praetor_display.ttf") format("truetype"); }
@font-face { font-family: "Praetor Body"; src: url("fonts/praetor_body_heavy.ttf") format("truetype"); font-weight: 800; }
@font-face { font-family: "Praetor Body"; src: url("fonts/praetor_body_black.ttf") format("truetype"); font-weight: 900; }

* { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0b16; color: #f4f1ff;
	font-family: "Praetor Body", "Nunito", "Segoe UI", sans-serif; font-weight: 800; -webkit-user-select: none; user-select: none; }
.disp { font-family: "Praetor Display", "Praetor Body", sans-serif; font-weight: normal; }

/* ------------------------------------------------------------ the page (gutters) */
#page { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
	background-image: -webkit-radial-gradient(rgba(142,98,255,.22) 1.4px, transparent 1.6px); background-image: radial-gradient(rgba(142,98,255,.22) 1.4px, transparent 1.6px);
	background-size: 14px 14px; -webkit-animation: drift 40s linear infinite; animation: drift 40s linear infinite; }
#vign { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
	background: -webkit-radial-gradient(center, ellipse, rgba(13,11,22,0) 40%, rgba(5,4,10,.85) 100%);
	background: radial-gradient(ellipse at center, rgba(13,11,22,0) 40%, rgba(5,4,10,.85) 100%); }
#flash { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #fffdf5; z-index: 50; pointer-events: none;
	-webkit-animation: flash .55s ease-out forwards; animation: flash .55s ease-out forwards; }

/* ------------------------------------------------------------ panels */
.slot { position: absolute; opacity: 0; -webkit-animation: slam .6s cubic-bezier(.2,1.4,.4,1) forwards; animation: slam .6s cubic-bezier(.2,1.4,.4,1) forwards; }
.panel { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #1a1530; border: 4px solid #f4f1ff; border-radius: 6px;
	box-shadow: 9px 10px 0 #05040a; overflow: hidden; }
#sA { left: 2.2vw; top: 3.5vh; width: 61vw; height: 55vh; -webkit-animation-delay: .1s; animation-delay: .1s; }
#sA .panel { -webkit-transform: rotate(-.8deg); transform: rotate(-.8deg); }
#sB { left: 65.2vw; top: 3.5vh; width: 32.6vw; height: 33vh; -webkit-animation-delay: .28s; animation-delay: .28s; }
#sB .panel { -webkit-transform: rotate(1deg); transform: rotate(1deg); overflow: visible; }
#sC { left: 65.2vw; top: 39.6vh; width: 32.6vw; height: 19vh; -webkit-animation-delay: .42s; animation-delay: .42s; }
#sC .panel { -webkit-transform: rotate(-.6deg); transform: rotate(-.6deg); overflow: visible; }
#sD { left: 2.2vw; top: 63vh; width: 95.6vw; height: 33vh; -webkit-animation-delay: .56s; animation-delay: .56s; }
#sD .panel { -webkit-transform: rotate(.35deg); transform: rotate(.35deg); overflow: visible; }

/* ------------------------------------------------------------ panel A: the cover */
#heroBg { position: absolute; left: -3%; top: -3%; width: 106%; height: 106%; background-size: cover; background-position: center;
	background-color: #241b45;
	background-image: -webkit-radial-gradient(center, ellipse, #3a2a78 0%, #1a1530 70%); background-image: radial-gradient(ellipse at center, #3a2a78 0%, #1a1530 70%);
	-webkit-animation: zoom 30s ease-in-out infinite alternate; animation: zoom 30s ease-in-out infinite alternate; }
#heroShade { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
	background: -webkit-radial-gradient(center, ellipse, rgba(26,21,48,.25) 0%, rgba(26,21,48,.85) 100%);
	background: radial-gradient(ellipse at center, rgba(26,21,48,.25) 0%, rgba(26,21,48,.85) 100%); }
.tone { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: .2;
	background-image: -webkit-radial-gradient(#05040a 2.2px, transparent 2.6px); background-image: radial-gradient(#05040a 2.2px, transparent 2.6px); background-size: 9px 9px; }
#rays { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#rays g { -webkit-animation: rays .36s steps(1) infinite; animation: rays .36s steps(1) infinite; }
#rays #rg2 { -webkit-animation-delay: -.18s; animation-delay: -.18s; }
.spark { position: absolute; color: #ffd36b; font-family: "Praetor Display"; opacity: 0; -webkit-animation: spark 4s ease-in-out infinite; animation: spark 4s ease-in-out infinite; }
#titleWrap { position: absolute; left: 3vw; right: 3vw; top: 30%; text-align: center; }
#title { display: inline-block; font-family: "Praetor Display"; line-height: 1.05; color: #fff; white-space: nowrap; font-size: 14vh; }
#title .w { display: inline-block; white-space: nowrap; }
#title .ch { position: relative; display: inline-block; opacity: 0;
	text-shadow: -4px -4px 0 #05040a, 4px -4px 0 #05040a, -4px 4px 0 #05040a, 4px 4px 0 #05040a, 0 4px 0 #05040a, 0 -4px 0 #05040a, 4px 0 0 #05040a, -4px 0 0 #05040a, 10px 11px 0 #8e62ff;
	-webkit-animation: letter .8s cubic-bezier(.2,1.8,.4,1) forwards, bob 3.2s ease-in-out infinite; animation: letter .8s cubic-bezier(.2,1.8,.4,1) forwards, bob 3.2s ease-in-out infinite; }
#sub { display: inline-block; margin-top: 2.6vh; padding: 1vh 2.2vh; background: #8e62ff; color: #fff; border: 4px solid #05040a; border-radius: 12px;
	box-shadow: 6px 6px 0 #05040a; font-size: 2.8vh; font-weight: 900; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
	opacity: 0; -webkit-animation: stamp .5s cubic-bezier(.2,1.6,.4,1) 1.25s forwards; animation: stamp .5s cubic-bezier(.2,1.6,.4,1) 1.25s forwards; }
#disc { position: absolute; left: 2vw; bottom: 2.6vh; padding: .9vh 2vh .9vh 6vh; background: #5865f2; color: #fff; border: 4px solid #05040a; border-radius: 999px;
	box-shadow: 5px 5px 0 #05040a; font-size: 2.2vh; font-weight: 900; white-space: nowrap; display: none; max-width: 70%; overflow: hidden; text-overflow: ellipsis;
	-webkit-transform: rotate(-2.5deg); transform: rotate(-2.5deg); }
#disc svg { position: absolute; left: 1.6vh; top: 50%; width: 3.4vh; height: 3.4vh; margin-top: -1.7vh; }
#logo { position: absolute; left: .8vw; top: 1vh; width: 12vh; height: 12vh; z-index: 5; border-radius: 50%; background: #8e62ff; border: .55vh solid #f4f1ff;
	box-shadow: 6px 7px 0 #05040a; overflow: hidden; text-align: center; font-family: "Praetor Display"; font-size: 6.6vh; line-height: 10.6vh; color: #fff;
	opacity: 0; -webkit-animation: spinIn .8s cubic-bezier(.2,1.5,.4,1) .85s forwards; animation: spinIn .8s cubic-bezier(.2,1.5,.4,1) .85s forwards; }
#logo img { width: 100%; height: 100%; }
#logoIn { width: 100%; height: 100%; -webkit-animation: wobble 5s ease-in-out infinite; animation: wobble 5s ease-in-out infinite; }

/* ------------------------------------------------------------ panel B: narrator + speech bubble */
#bubble { position: absolute; left: 1.3vw; right: 1.3vw; top: 2vh; height: 19vh; background: #fffdf5; color: #120e20; border: 4px solid #05040a;
	border-radius: 26px; padding: 1.5vh 2vh; box-shadow: 5px 5px 0 #05040a; }
#tail { position: absolute; left: 7vh; top: 20.4vh; width: 5vh; height: 4.6vh; }
#tipHead { font-family: "Praetor Display"; font-size: 2.2vh; color: #8e62ff; letter-spacing: 1px; }
#tipHead i { font-style: normal; font-family: "Praetor Body"; font-weight: 900; font-size: 1.6vh; color: rgba(18,14,32,.45); margin-left: 1vh; }
#tipText { margin-top: .6vh; font-size: 2.3vh; line-height: 3.1vh; font-weight: 900; }
#tipText b { font-weight: 900; opacity: 0; }
#mascot { position: absolute; left: 1vw; bottom: .6vh; width: 10.5vh; height: 10.5vh; -webkit-animation: hover 2.6s ease-in-out infinite; animation: hover 2.6s ease-in-out infinite; }
#mascot.talk { -webkit-animation: talk .22s ease-in-out infinite alternate; animation: talk .22s ease-in-out infinite alternate; }
#mascot svg { width: 100%; height: 100%; overflow: visible; }
#tipDots { position: absolute; left: 13.5vh; bottom: 3.6vh; }
#tipDots b { display: inline-block; width: 1.1vh; height: 1.1vh; margin-right: .7vh; border-radius: 50%; background: rgba(244,241,255,.25); border: 2px solid #05040a;
	-webkit-transition: all .3s; transition: all .3s; }
#tipDots b.on { background: #ffd36b; width: 2.8vh; border-radius: 999px; }
#tipBtn { position: absolute; right: 1.3vw; bottom: 2.2vh; padding: .8vh 2vh; border: 3px solid #05040a; border-radius: 999px; background: #ffd36b; color: #120e20;
	font-size: 1.8vh; font-weight: 900; cursor: pointer; box-shadow: 4px 4px 0 #05040a; -webkit-transition: -webkit-transform .12s; transition: transform .12s; }
#tipBtn:hover { -webkit-transform: translate(-2px,-2px) rotate(-2deg); transform: translate(-2px,-2px) rotate(-2deg); }
#tipBtn:active { -webkit-transform: translate(3px,3px); transform: translate(3px,3px); box-shadow: 0 0 0 #05040a; }

/* ------------------------------------------------------------ panel C: caption boxes */
.row { position: absolute; left: 1.3vw; right: 1.3vw; height: 4.7vh; opacity: 0;
	-webkit-animation: slideR .5s cubic-bezier(.2,1.5,.4,1) forwards; animation: slideR .5s cubic-bezier(.2,1.5,.4,1) forwards; }
#r1 { top: 1.6vh; -webkit-animation-delay: .9s; animation-delay: .9s; }
#r2 { top: 7.1vh; -webkit-animation-delay: 1.02s; animation-delay: 1.02s; }
#r3 { top: 12.6vh; -webkit-animation-delay: 1.14s; animation-delay: 1.14s; }
.row .ico { position: absolute; left: 0; top: 0; width: 4.7vh; height: 4.7vh; border-radius: 10px; background: #8e62ff; border: 3px solid #05040a; box-shadow: 3px 3px 0 #05040a; }
.row .ico svg { position: absolute; left: 50%; top: 50%; width: 2.7vh; height: 2.7vh; margin: -1.35vh 0 0 -1.35vh; }
.row .lbl { position: absolute; left: 6.3vh; top: 0; font-size: 1.35vh; line-height: 1.7vh; letter-spacing: .25vh; text-transform: uppercase; color: rgba(244,241,255,.55); font-weight: 900; }
.row .val { position: absolute; left: 6.3vh; right: 0; top: 1.7vh; font-family: "Praetor Display"; font-size: 2.5vh; line-height: 3vh; color: #fff;
	white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .val.swap { -webkit-animation: tipin .45s ease-out; animation: tipin .45s ease-out; }

/* ------------------------------------------------------------ panel D: the loading sound effect */
#status { position: absolute; left: 4.6vw; top: 60.2vh; z-index: 6; max-width: 56vw; padding: .9vh 2vh; background: #ffd36b; color: #120e20; border: 4px solid #05040a;
	box-shadow: 5px 5px 0 #05040a; font-size: 2.4vh; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
	-webkit-transform: rotate(-1.8deg); transform: rotate(-1.8deg); opacity: 0; -webkit-animation: stamp .5s cubic-bezier(.2,1.6,.4,1) 1s forwards; animation: stamp .5s cubic-bezier(.2,1.6,.4,1) 1s forwards; }
#status.swap { -webkit-animation: nudge .35s ease-out; animation: nudge .35s ease-out; opacity: 1; }
#sfx { position: absolute; left: 2.5vw; top: 4.4vh; height: 11.5vh; white-space: nowrap; font-family: "Praetor Display"; font-size: 10vh; line-height: 11.5vh; }
#sfx span { position: relative; display: inline-block; -webkit-animation: wave 1.6s ease-in-out infinite; animation: wave 1.6s ease-in-out infinite; }
#sfxGhost { color: rgba(244,241,255,.07); -webkit-text-stroke: 2px rgba(244,241,255,.45); }
#sfxClip { position: absolute; left: 0; top: 0; height: 100%; width: 0; overflow: hidden; }
#sfxFill { color: #8e62ff; -webkit-text-stroke: 3px #05040a; text-shadow: 6px 6px 0 #05040a; }
#barWrap { position: absolute; left: 2.5vw; right: 61vh; top: 17.8vh; height: 3.8vh; }
#bar { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 4px solid #f4f1ff; border-radius: 999px; background: #0d0b16; overflow: hidden; box-shadow: 5px 5px 0 #05040a; }
#ticks { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
	background-image: -webkit-linear-gradient(left, rgba(244,241,255,.18) 2px, transparent 2px); background-image: linear-gradient(to right, rgba(244,241,255,.18) 2px, transparent 2px);
	background-size: 10% 100%; }
#fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background-color: #8e62ff; border-right: 3px solid #05040a;
	background-image: -webkit-linear-gradient(135deg, rgba(255,255,255,.22) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.22) 50%, rgba(255,255,255,.22) 75%, transparent 75%, transparent);
	background-image: linear-gradient(135deg, rgba(255,255,255,.22) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.22) 50%, rgba(255,255,255,.22) 75%, transparent 75%, transparent);
	background-size: 30px 30px; -webkit-animation: stripes .9s linear infinite; animation: stripes .9s linear infinite; }
#runner { position: absolute; top: -4.6vh; left: 0; width: 4.6vh; height: 4.6vh; margin-left: -2.3vh; -webkit-animation: hop .45s ease-in-out infinite alternate; animation: hop .45s ease-in-out infinite alternate; }
#runner svg { width: 100%; height: 100%; overflow: visible; }
#file { position: absolute; left: 2.6vw; right: 61vh; top: 23.4vh; font-size: 1.9vh; color: rgba(244,241,255,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#file b { color: #ffd36b; font-weight: 900; }
#burst { position: absolute; right: 34vh; top: 2.8vh; width: 24vh; height: 24vh; -webkit-animation: rock 3s ease-in-out infinite; animation: rock 3s ease-in-out infinite; }
#burst svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
#burstIn { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#burstIn.bump { -webkit-animation: bump .4s cubic-bezier(.2,1.8,.4,1); animation: bump .4s cubic-bezier(.2,1.8,.4,1); }
#pct { position: absolute; left: 0; right: 0; top: 50%; margin-top: -4.4vh; text-align: center; font-family: "Praetor Display"; font-size: 7vh; line-height: 8.8vh; color: #120e20; }
#pct small { font-size: 3.4vh; }
#music { position: absolute; right: 3vh; top: 3.4vh; width: 28vh; height: 17.8vh; cursor: pointer; -webkit-transition: -webkit-transform .15s; transition: transform .15s; }
#music:hover { -webkit-transform: rotate(-3deg) scale(1.04); transform: rotate(-3deg) scale(1.04); }
#music svg { width: 100%; height: 100%; overflow: visible; }
#music.muted #casBody { opacity: .45; }
#hint { position: absolute; right: 3vh; top: 23.4vh; width: 28vh; text-align: center; font-size: 1.7vh; color: rgba(244,241,255,.55); white-space: nowrap; }
#hint kbd { display: inline-block; padding: .2vh 1vh; margin-right: .8vh; border: 2px solid #f4f1ff; border-radius: 7px; color: #fff; font-family: "Praetor Body"; font-weight: 900;
	box-shadow: 2px 2px 0 #05040a; }
#credit { position: absolute; right: 2.4vw; bottom: .9vh; font-size: 1.3vh; letter-spacing: .35vh; color: rgba(244,241,255,.25); }

/* ------------------------------------------------------------ animations */
@-webkit-keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
@-webkit-keyframes slam { 0% { opacity: 0; -webkit-transform: scale(1.22) rotate(3deg); } 55% { opacity: 1; -webkit-transform: scale(.97) rotate(-.5deg); } 100% { opacity: 1; -webkit-transform: none; } }
@keyframes slam { 0% { opacity: 0; transform: scale(1.22) rotate(3deg); } 55% { opacity: 1; transform: scale(.97) rotate(-.5deg); } 100% { opacity: 1; transform: none; } }
@-webkit-keyframes stamp { 0% { opacity: 0; -webkit-transform: scale(2) rotate(-12deg); } 100% { opacity: 1; -webkit-transform: rotate(-1.8deg); } }
@keyframes stamp { 0% { opacity: 0; transform: scale(2) rotate(-12deg); } 100% { opacity: 1; transform: rotate(-1.8deg); } }
@-webkit-keyframes nudge { 0% { -webkit-transform: rotate(-1.8deg) translateX(-14px); } 50% { -webkit-transform: rotate(1deg) translateX(6px); } 100% { -webkit-transform: rotate(-1.8deg); } }
@keyframes nudge { 0% { transform: rotate(-1.8deg) translateX(-14px); } 50% { transform: rotate(1deg) translateX(6px); } 100% { transform: rotate(-1.8deg); } }
@-webkit-keyframes spinIn { 0% { opacity: 0; -webkit-transform: scale(.2) rotate(-200deg); } 100% { opacity: 1; -webkit-transform: none; } }
@keyframes spinIn { 0% { opacity: 0; transform: scale(.2) rotate(-200deg); } 100% { opacity: 1; transform: none; } }
@-webkit-keyframes letter { 0% { opacity: 0; -webkit-transform: translateY(-60px) scale(.4) rotate(-14deg); } 100% { opacity: 1; -webkit-transform: none; } }
@keyframes letter { 0% { opacity: 0; transform: translateY(-60px) scale(.4) rotate(-14deg); } 100% { opacity: 1; transform: none; } }
@-webkit-keyframes bob { 0%,100% { top: 0; } 50% { top: -7px; } }
@keyframes bob { 0%,100% { top: 0; } 50% { top: -7px; } }
@-webkit-keyframes wave { 0%,60%,100% { top: 0; } 30% { top: -1.4vh; } }
@keyframes wave { 0%,60%,100% { top: 0; } 30% { top: -1.4vh; } }
@-webkit-keyframes wobble { 0%,100% { -webkit-transform: rotate(-5deg); } 50% { -webkit-transform: rotate(5deg); } }
@keyframes wobble { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@-webkit-keyframes rock { 0%,100% { -webkit-transform: rotate(-6deg); } 50% { -webkit-transform: rotate(6deg); } }
@keyframes rock { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
@-webkit-keyframes bump { 0% { -webkit-transform: scale(1); } 40% { -webkit-transform: scale(1.22); } 100% { -webkit-transform: scale(1); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
@-webkit-keyframes hover { 0%,100% { -webkit-transform: translateY(0) rotate(-3deg); } 50% { -webkit-transform: translateY(-.8vh) rotate(3deg); } }
@keyframes hover { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-.8vh) rotate(3deg); } }
@-webkit-keyframes talk { from { -webkit-transform: scale(1, 1) rotate(-2deg); } to { -webkit-transform: scale(1.04, .95) rotate(2deg); } }
@keyframes talk { from { transform: scale(1, 1) rotate(-2deg); } to { transform: scale(1.04, .95) rotate(2deg); } }
@-webkit-keyframes hop { from { -webkit-transform: translateY(0) rotate(-8deg); } to { -webkit-transform: translateY(-.9vh) rotate(8deg); } }
@keyframes hop { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-.9vh) rotate(8deg); } }
@-webkit-keyframes stripes { from { background-position: 0 0; } to { background-position: 30px 0; } }
@keyframes stripes { from { background-position: 0 0; } to { background-position: 30px 0; } }
@-webkit-keyframes tipin { 0% { opacity: 0; -webkit-transform: translateX(24px); } 100% { opacity: 1; -webkit-transform: none; } }
@keyframes tipin { 0% { opacity: 0; transform: translateX(24px); } 100% { opacity: 1; transform: none; } }
@-webkit-keyframes slideR { 0% { opacity: 0; -webkit-transform: translateX(60px) rotate(4deg); } 100% { opacity: 1; -webkit-transform: none; } }
@keyframes slideR { 0% { opacity: 0; transform: translateX(60px) rotate(4deg); } 100% { opacity: 1; transform: none; } }
@-webkit-keyframes spark { 0%,100% { opacity: 0; -webkit-transform: scale(.3) rotate(0); } 50% { opacity: .9; -webkit-transform: scale(1) rotate(90deg); } }
@keyframes spark { 0%,100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: .9; transform: scale(1) rotate(90deg); } }
@-webkit-keyframes zoom { from { -webkit-transform: scale(1); } to { -webkit-transform: scale(1.1) translate(-1.5%, 1%); } }
@keyframes zoom { from { transform: scale(1); } to { transform: scale(1.1) translate(-1.5%, 1%); } }
@-webkit-keyframes drift { to { background-position: 140px 140px; } }
@keyframes drift { to { background-position: 140px 140px; } }
@-webkit-keyframes rays { 0% { opacity: 1; } 50% { opacity: .35; } }
@keyframes rays { 0% { opacity: 1; } 50% { opacity: .35; } }
</style>
</head>
<body>
<div id="page"></div>
<div id="vign"></div>

<!-- the little praetor helmet, used by the narrator and by the runner on the bar -->
<svg width="0" height="0" style="position:absolute">
	<defs>
		<symbol id="helm" viewBox="0 0 100 100">
			<path d="M30 30 Q50 -4 74 24" fill="none" stroke="#05040a" stroke-width="17" stroke-linecap="round"/>
			<path class="crest" d="M30 30 Q50 -4 74 24" fill="none" stroke="#8e62ff" stroke-width="10" stroke-linecap="round"/>
			<path d="M20 60 Q20 22 50 22 Q80 22 80 60 L72 84 L58 76 L58 64 L42 64 L42 76 L28 84 Z" fill="#f4f1ff" stroke="#05040a" stroke-width="5" stroke-linejoin="round"/>
			<rect x="27" y="42" width="46" height="20" rx="9" fill="#120e20" stroke="#05040a" stroke-width="3"/>
			<ellipse cx="40" cy="52" rx="4" ry="5" fill="#fffdf5"/>
			<ellipse cx="60" cy="52" rx="4" ry="5" fill="#fffdf5"/>
		</symbol>
	</defs>
</svg>

<!-- panel A: the cover with the server name -->
<div class="slot" id="sA"><div class="panel">
	<div id="heroBg"></div>
	<div id="heroShade"></div>
	<div class="tone"></div>
	<svg id="rays" viewBox="0 0 100 100" preserveAspectRatio="none"><g id="rg1"></g><g id="rg2"></g></svg>
	<div id="sparks"></div>
	<div id="titleWrap"><div id="title"></div><br><div id="sub"></div></div>

<script>
(function () {

			downloading: "Downloading",

	// ---------------------------------------------------------------- the cover: name, sub, logo, discord

			var ws = box.getElementsByTagName("span");
			var widest = function () { var m = 0; for (var q = 0; q < ws.length; q++) if (ws[q].className === "w" && ws[q].offsetWidth > m) m = ws[q].offsetWidth; return m; };
			while ((box.offsetHeight > size * 2.4 || widest() > avail) && size > 18 && guard < 60) { size *= 0.93; box.style.fontSize = size + "px"; guard++; }
		}
		// keep the title + sub in the middle of the panel
		var panel = $("sA");
		wrap.style.top = Math.max(vh(9), (panel.offsetHeight - wrap.offsetHeight) / 2 - vh(1)) + "px";
	}
	function buildTitle(t) {

		var words = t.split(" "), n = 0;
		var shadow = "-4px -4px 0 #05040a, 4px -4px 0 #05040a, -4px 4px 0 #05040a, 4px 4px 0 #05040a, 0 4px 0 #05040a, 0 -4px 0 #05040a, 4px 0 0 #05040a, -4px 0 0 #05040a, 10px 11px 0 " + acc;

	var NS = "http://www.w3.org/2000/svg";

			p.setAttribute("points",
				(50 + Math.cos(a - da) * 160) + "," + (50 + Math.sin(a - da) * 160) + " " +
				(50 + Math.cos(a + da) * 160) + "," + (50 + Math.sin(a + da) * 160) + " " +
				(50 + Math.cos(a) * r1) + "," + (50 + Math.sin(a) * r1));
			p.setAttribute("fill", i % 5 === 0 ? acc : "#f4f1ff");
			p.setAttribute("fill-opacity", i % 5 === 0 ? "0.22" : "0.08");
			group.appendChild(p);
		}
	}
	try { rays($("rg1"), 54, 0); rays($("rg2"), 54, 0.5); } catch (e) {}

	var sparkBox = $("sparks");
	for (var k = 0; k < 12; k++) {
		var sp = document.createElement("div");
		sp.className = "spark";
		sp.innerHTML = k % 3 === 0 ? "&#10022;" : "&#10023;";
		sp.style.left = (Math.random() * 92 + 3) + "%";
		sp.style.top = (Math.random() * 86 + 6) + "%";
		sp.style.fontSize = (14 + Math.random() * 24) + "px";
		if (k % 4 === 0) sp.style.color = "#ff8fc6";
		var dl = (Math.random() * 4).toFixed(2) + "s";

		sparkBox.appendChild(sp);
	}

	// ---------------------------------------------------------------- the narrator: tips typed into the speech bubble
	var customTips = false;
	var tips = L("tips");
	var tp = param("tips");
	if (tp) {
		var list = tp.split("|"), clean = [];
		for (var j = 0; j < list.length; j++) if (list[j].replace(/\s/g, "") !== "") clean.push(list[j]);
		if (clean.length) { tips = clean; customTips = true; }
	}
	var tipIdx = 0, typeTimer = null, typeChars = [], typeAt = 0;
	function fitTip() {
		var el = $("tipText"), bubble = $("bubble");
		var size = vh(2.3), guard = 0;
		el.style.fontSize = size + "px"; el.style.lineHeight = (size * 1.35) + "px";
		var room = bubble.clientHeight - el.offsetTop - vh(1);
		while (el.offsetHeight > room && size > 10 && guard < 30) { size *= 0.92; el.style.fontSize = size + "px"; el.style.lineHeight = (size * 1.35) + "px"; guard++; }
	}
	function typeStep() {

		for (var n = 0; n < 2 && typeAt < typeChars.length; n++) { typeChars[typeAt].style.opacity = 1; typeAt++; }

	}

		if (!tips.length) return;

	function applyLang() {
		text("lMap", L("map")); text("lSlots", L("slots")); text("lMode", L("mode"));

	// ---------------------------------------------------------------- progress (Garry's Mod calls these)

		$("fill").style.width = Math.round(barW * k) + "px";
		$("runner").style.left = Math.round(4 + (barW - 4) * k) + "px";
		$("sfxClip").style.width = Math.round($("sfxGhost").offsetWidth * k + (k > 0 ? 4 : 0)) + "px";
		$("pct").innerHTML = Math.floor(shown) + "<small>%</small>";
		var ten = Math.floor(shown / 10);
		if (ten > lastTen) { lastTen = ten; restart($("burstIn"), "bump"); }
		if (shown >= 99.5) setSfx(L("ready"));
		// cassette: the reels turn while the music plays, the tape moves from left to right as you load
		if (musicOn) reelA = (reelA + 9) % 360;
		$("reelL").setAttribute("transform", "rotate(" + reelA + " 76 83)");
		$("reelR").setAttribute("transform", "rotate(" + reelA + " 136 83)");
		$("tapeL").setAttribute("r", (20 - 7 * k).toFixed(1));
		$("tapeR").setAttribute("r", (13 + 7 * k).toFixed(1));
	}
	setInterval(tick, 40);

	var lastStatus = "";
	var stages = [["retrieving", 6], ["sending client", 10], ["workshop", 14], ["mount", 16], ["download", 18], ["lua", 90], ["client info", 92], ["parsing", 93], ["starting", 95], ["precach", 97]];
	function setStatus(s, quiet) {
		lastStatus = s;
		var low = s.toLowerCase(), nice = "", st = L("stages");
		for (var i = 0; i < stages.length; i++) if (low.indexOf(stages[i][0]) >= 0) { nice = st[stages[i][0]] || ""; if (!quiet) setTarget(stages[i][1]); }
		var shownText = nice ? nice + "..." : s;
		var el = $("status");
		if ((el.textContent || el.innerText) !== shownText) {
			text(el, shownText);
			if (!quiet) { el.style.opacity = 1; restart(el, "swap"); }
		}
	}

	window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
		if (language) lang = String(language).toLowerCase().indexOf("pt") === 0 ? "pt" : "en";
		if (!param("fixed") && servername && servername !== name) { name = servername; buildTitle(name); setLogoLetter(); }
		if (mapname) { text("vMap", mapname); restart($("vMap"), "swap"); }
		if (maxplayers) { text("vSlots", maxplayers + " " + L("players")); restart($("vSlots"), "swap"); }
		if (gamemode) { text("vMode", gamemode); restart($("vMode"), "swap"); }
		if (volume !== undefined && volume !== null && !isNaN(parseFloat(volume))) { gameVol = parseFloat(volume); applyVol(); }
		applyLang();
		setTarget(4);
	};
	window.SetFilesTotal = function (n) { total = Math.max(total, n || 0); };
	window.SetFilesNeeded = function (n) {
		needed = n || 0;
		if (total > 0) setTarget(8 + (total - needed) / total * 80);
	};
	window.DownloadingFile = function (f) {
		var nm = String(f || "").replace(/^.*[\\\/]/, "");
		var count = total > 0 ? " <b>" + (total - needed) + " / " + total + "</b> " + L("files") + " · " : " ";
		$("file").innerHTML = L("downloading") + count + esc(nm);
	};
	window.SetStatusChanged = function (s) { setStatus(String(s || "")); };

	applyLang();

	// fonts arrive a moment later: measure again once they are in
	function refit() { fitTitle(); fitSfx(); if (typeChars.length) fitTip(); }
	setTimeout(refit, 400); setTimeout(refit, 1500);
	window.onresize = refit;
})();
</script>
</body>
